[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "larksync"
version = "0.1.0"
description = "Feishu personal cloud sync toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "LarkSync Developers"}]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "tenacity>=8.2.3",
    "typer>=0.9.0",
    "python-dateutil>=2.8.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.34",
    "apscheduler>=3.10.4",
    "itsdangerous>=2.2.0"
]

[tool.setuptools.packages.find]
include = ["larksync*"]

[project.scripts]
larksync = "larksync.cli:app"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.typer]
pretty_exceptions_enable = true
